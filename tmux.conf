# ===============================================
# From Junfeng Lei
# ===============================================

# ---* settings
# set scroll history to 100,000 lines
set-option -g history-limit 100000

set-option -a terminal-features 'xterm-256color:RGB'

# Let pane applications set the outer terminal clipboard via OSC 52.
# This keeps yazi's `cc` working inside tmux over SSH from WezTerm.
set -s set-clipboard on

# Allow terminal graphics (iTerm2/Kitty/Sixel) to pass through tmux to the host terminal
%if "#{>=:#{version},3.3}"
set -g allow-passthrough on
%endif
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# numbering window from base 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# set pane border style
set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=magenta

# renumber window number when close or open a new window
set -g renumber-windows on

# Avoid ESC delay
set -s escape-time 0

# Fix title bar
# Emit host + session name as the OS window title so the wezterm tab title
# (which renders the active pane title) matches the tmux status bar.
set -g set-titles on
set -g set-titles-string "#{=5:#{host}} · #S"

# Keep applications from clearing pane titles via OSC 0/2. Empty titles can
# shift fields in tmux-resurrect's tab-separated snapshot format.
setw -g allow-set-title off

# VIM mode
set -g mode-keys vi

# Mouse friendly
set -g mouse on

# Set status bat position to top
set-option -g status-position top

# ---* key bindings
# unbind the original prefix and bind it to Alt-a
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# disable the right click menu
unbind -n MouseDown3Pane

# reload tmux.conf file
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# return to marked pane with prefix+`
bind \` switch-client -t'{marked}'

# more intuitive way to split pane vertically and horizontally
unbind "\""
unbind "%"
bind "|" split-window -h -c "#{pane_current_path}"
bind "\\" split-window -fh -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"
bind "_" split-window -fv -c "#{pane_current_path}"

# swap window
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# toggle between windows
bind M-a last-window

# toggle between sessions
# unbind Space
bind Space switch-client -l

# session chooser sorted by name (override default choose-tree -Zs)
bind s choose-tree -Zs -O name

# keep current path when creating new window
bind c new-window -c "#{pane_current_path}"

# choose one window to join in
bind j choose-window 'join-pane -h -s "%%"' # vertically
bind J choose-window 'join-pane -s "%%"'    # horizontally

# maximize a pane
bind M-z resize-pane -Z

# Move between panes with vi keys
# bind M-h select-pane -L
# bind M-j select-pane -D
# bind M-k select-pane -U
# bind M-l select-pane -R

# resize with arrow keys
bind -r M-Down resize-pane -D 15
bind -r M-Up resize-pane -U 15
bind -r M-Left resize-pane -L 15
bind -r M-Right resize-pane -R 15

# shortcut for pushing the current tmux buffer to the system clipboard
# useful if you've selected with the mouse. Re-loading with -w forwards it to the
# outer terminal via OSC 52 (set-clipboard on), so it works over SSH without the
# xclip/wl-copy hang that happens when no display server is reachable.
bind -nr C-y run 'tmux show-buffer | tmux load-buffer -w -'

# copy to clipboard: copy-selection sets a tmux buffer, which tmux forwards to the
# outer terminal via OSC 52 (set-clipboard on). No external tool => SSH-safe.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi Enter send-keys -X cancel

# ---* default key bindings
# prefix+I - reload tmux environment
# prefix+m - mark pane
# prefix+! - split panes in one window into different windows

# ---* Tmux Plugin Manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'  # requires yq
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Continuum's boot handling is one option over two entirely different
# mechanisms, and only the systemd one is wanted.
#
# On Linux it manages a unit at the exact path we use for the hand-written
# ~/.config/systemd/user/tmux.service, and with @continuum-boot unset it runs
# `systemctl --user disable tmux.service` on *every* server start -- so the unit
# would start once and be disabled for the next boot. Turning boot on makes
# continuum enable that unit instead; it only writes its own template when the
# file is absent, so our version is preserved.
#
# On macOS 'on' means something else entirely: handle_tmux_automatic_start.sh
# tests is_osx *before* is_systemd, so the systemd branch is unreachable and
# osx_enable.sh writes ~/Library/LaunchAgents/Tmux.Start.plist with RunAtLoad.
# That plist AppleScripts Terminal.app open at every login, types `tmux` into
# it and full-screens it -- a terminal this machine does not use -- and it
# registers as a background login item needing TCC approval. 'off' is not
# merely the absence of that: osx_disable.sh deletes the plist if one was ever
# written, so this also cleans up after itself.
#
# if-shell without -b blocks the command queue, so this resolves before tpm
# runs continuum at the bottom of this file.
if-shell '[ "$(uname -s)" = "Linux" ]' \
    "set -g @continuum-boot 'on'" \
    "set -g @continuum-boot 'off'"

# Addon: on every save, annotate the *archived* copy of each pane that has a
# Claude/Codex session running in it, so the restored pane prints that session's
# id and resume command after replaying its contents. Nothing is restarted.
# The value is eval'd by the plugin, so $HOME expands at hook time; it must stay
# a real script rather than a shell builtin, or an `exit` would abort save.sh
# mid-flight and orphan its spinner.
set -g @resurrect-hook-post-save-all '$HOME/Documents/dotfiles/agent-sessions/bin/agent-panes-resurrect save'

# Addon: resurrect replays each window's saved `window_layout` with
# `select-layout`, which sizes the layout's cells without resizing the window to
# match -- so a layout saved under a big client and restored under a smaller one
# leaves panes larger than the window they sit in, with the shell prompt below
# the visible bottom. tmux re-lays a window out only when its size changes, so
# nothing heals it afterwards. This refits them, and never resizes a window.
# Silent for the same reason as the save hook: a manual `prefix + C-r` runs
# restore.sh through run-shell, whose stdout is the job pipe.
set -g @resurrect-hook-post-restore-all '$HOME/Documents/dotfiles/utils/tmux-refit-windows'

# theme catppuccin
set -g @plugin 'catppuccin/tmux'
# Continuum injects its autosave command into status-right, so keep it last.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_pane_status_enabled "no"
set -g @catppuccin_pane_border_status "off"

# tmux status
set -g status-position top
set -g status-justify "left"

# status left
set -g status-left-length 100
set -g status-left ""

# status right
set -g status-right-length 100
%if "#{m:*tmux-continuum/scripts/continuum_save.sh*,#{status-right}}"
# Preserve the active hook across reloads. Continuum intentionally declines to
# add it while another tmux server exists, which otherwise disables autosaves.
set -gF status-right '##(#{HOME}/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)'
%else
set -g status-right ""
%endif
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_maroon}] #W "
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-right "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_mantle},bold]},#{#[bg=#{@thm_mantle},fg=#{@thm_green}]}}  #S "
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
# /etc/os-release is Linux-only, so the old unguarded `cat` left DISTRO_NAME
# empty on a Mac. It did so quietly -- run-shell prints a job's stdout and
# discards its stderr, and the outer `set-environment` exits 0 either way -- so
# the `[ -r ]` guard is for the value, not for noise. `uname -s` is only a
# label: `Darwin` matches none of the three distro tests in the glyph chain
# below, so it renders the same generic branch an empty value would.
run-shell 'tmux set-environment -g DISTRO_NAME "$([ -r /etc/os-release ] && . /etc/os-release && printf %s "$ID" || uname -s)"'
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_blue}] #{?#{m:*arch*,#{DISTRO_NAME}},,#{?#{m:*ubuntu*,#{DISTRO_NAME}},,#{?#{m:*rocky*,#{DISTRO_NAME}},,}}} #H "

# pane border
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_mantle},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_mantle},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window
set -wg automatic-rename on
set -g automatic-rename-format ""
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_number ""
set -g @catppuccin_window_flags_icon_current ""
set -g @catppuccin_window_text "#{?window_last_flag,#{#[bg=#{@thm_mantle},fg=#{@thm_peach}]},#{#[bg=#{@thm_mantle},fg=#{@thm_rosewater}]}} #I #W  #{s|$USER|~|:#{b:pane_current_path}}"
set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_text "#[bg=#{@thm_peach},fg=#{@thm_mantle}] #I #W  #{=/-32/...:#{s|$HOME|~|:#{pane_current_path}}}"
set -gF window-status-separator "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
