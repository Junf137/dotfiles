session_name: regular

start_directory: ~/Documents

windows:
  - window_name: editor
    focus: true
    layout: even-horizontal
    panes:
      - focus: true
        shell_command:
        - tmux select-pane -m && fastfetch
  - window_name: other
    layout: even-horizontal
    panes:
      - focus: true
        shell_command:
        - clear
      - shell_command:
        - clear
