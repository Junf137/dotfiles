# Portable defaults for macOS and Linux, loaded through /etc/codex/config.toml.
# Machine paths and app-managed state belong in the regular ~/.codex/config.toml.
model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
service_tier = "priority"
approval_policy = "never"

[features]
multi_agent = true
memories = true
goals = true

# The default budget (2% of the context window) cuts each skill description
# to its first 50 to 150 characters. 10000 is the most Codex accepts.
[skills]
max_context_tokens = 10000

[tui]
status_line = ["thread-title", "git-branch", "model-with-reasoning", "context-used", "five-hour-limit", "weekly-limit"]
session_picker_view = "comfortable"
status_line_use_colors = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
