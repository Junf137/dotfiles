# systemd-tmpfiles rules for the handoff scratch directory.
#
# The `handoff` agent skill writes documents with `mktemp -p ~/hf`. This rule
# keeps that directory present and prunes entries 10 days after they were last
# touched, so handoffs survive reboots without accumulating forever.
#
# Cleanup runs via the user timer, enabled once with:
#   systemctl --user enable --now systemd-tmpfiles-clean.timer
#
# Preview what would be removed:
#   systemd-tmpfiles --user --clean --dry-run
#
# Type Path  Mode User Group Age Argument
d %h/hf 0755 - - 10d -
